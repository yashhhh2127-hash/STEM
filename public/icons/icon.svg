<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312e81" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#stemGrad)" />

  <!-- Orbit 1 (Horizontal) -->
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.95" />
  
  <!-- Orbit 2 (Rotated 60deg) -->
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.95" transform="rotate(60 256 256)" />
  
  <!-- Orbit 3 (Rotated -60deg) -->
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.95" transform="rotate(-60 256 256)" />

  <!-- Nucleus Core -->
  <circle cx="256" cy="256" r="44" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Electron nodes on orbits -->
  <circle cx="416" cy="256" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
  <circle cx="176" cy="117" r="14" fill="#a855f7" stroke="#ffffff" stroke-width="3" />
  <circle cx="176" cy="395" r="14" fill="#34d399" stroke="#ffffff" stroke-width="3" />
</svg>
